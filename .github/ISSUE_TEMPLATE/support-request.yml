name: Support request
description: Get help with Groundhog installation, configuration, or behavior.
title: "[Support]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe one problem. Remove secrets and private data from all examples and logs.
  - type: input
    id: version
    attributes:
      label: Groundhog version
      description: Run `groundhog --version` and enter the complete output.
      placeholder: "groundhog 0.1.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS on Apple silicon
        - Linux on x86-64
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: List the shortest steps that reproduce the problem.
      placeholder: |
        1. Run ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State the result that you expected.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: State the result that occurred. Include sanitized logs when they help explain the problem.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: State who the problem affects and whether work can continue.
    validations:
      required: true
